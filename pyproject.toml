[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tholos"
version = "0.1.0"
description = "Always-on small agents that share one workspace."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["starlette", "uvicorn", "httpx", "jinja2", "openpyxl", "python-multipart"]

[project.scripts]
tholos = "tholos.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["tholos"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
