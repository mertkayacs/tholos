<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Tholos</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="login-wrap">
  <a class="brand" href="/">{% include "logo.svg" %}<span class="word">Tholos</span></a>
  <div class="card">
    <h1>Log in</h1>
    <p class="muted">This Tholos is reachable from other machines, so it asks for the access token that was printed when it started.</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <div class="field">
        <label for="token">Access token</label>
        <input type="password" id="token" name="token" autocomplete="current-password" required autofocus>
      </div>
      <button class="btn primary" type="submit">Log in</button>
    </form>
  </div>
</main>
</body>
</html>
