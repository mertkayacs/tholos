<p class="muted">Optional. Tholos messages you when an agent needs a decision, fails, or hands you a task, and you can answer or approve from chat.</p>
{% if test_result %}
<p role="status" class="{% if test_result.ok %}success{% else %}error{% endif %}">
  {{ test_result.message }}</p>
{% endif %}
<form hx-post="/settings/telegram" hx-target="#telegram-wrap" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="form-row">
    <div class="field grow">
      <label for="tg-token">Bot token</label>
      <input type="password" id="tg-token" name="bot_token" autocomplete="off"
             {% if telegram.configured %}placeholder="Saved ({{ telegram.token_masked }})"{% endif %}>
      <p class="hint">Leave blank to keep the saved token.</p>
    </div>
    <div class="field">
      <label for="tg-chat">Owner chat id</label>
      <input type="text" id="tg-chat" name="owner_chat_id" value="{{ telegram.owner_chat_id }}"
             inputmode="numeric">
    </div>
  </div>
  <div class="actions">
    <button class="btn secondary" type="submit">Save</button>
    <button class="btn secondary" type="submit" form="tg-test">Send test message</button>
  </div>
</form>
<form id="tg-test" hx-post="/settings/telegram/test" hx-target="#telegram-wrap" method="post" class="inline-form">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
</form>
