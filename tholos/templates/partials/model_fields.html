<div class="form-row">
  <div class="field">
    <label for="model-name-{{ m.id if m else 'new' }}">Name</label>
    <input type="text" id="model-name-{{ m.id if m else 'new' }}" name="name"
           value="{{ m.name if m else '' }}" required>
  </div>
  <div class="field" style="flex: 1">
    <label for="model-url-{{ m.id if m else 'new' }}">Base URL</label>
    <input type="url" id="model-url-{{ m.id if m else 'new' }}" name="base_url"
           value="{{ m.base_url if m else '' }}" placeholder="http://127.0.0.1:11434/v1" required>
  </div>
  <div class="field">
    <label for="model-model-{{ m.id if m else 'new' }}">Model</label>
    <input type="text" id="model-model-{{ m.id if m else 'new' }}" name="model"
           value="{{ m.model if m else '' }}" required>
  </div>
</div>
<div class="form-row">
  <div class="field">
    <label for="model-key-{{ m.id if m else 'new' }}">API key</label>
    <input type="password" id="model-key-{{ m.id if m else 'new' }}" name="api_key"
           {% if m and m.api_key_masked %}placeholder="Saved ({{ m.api_key_masked }})"{% endif %}>
    <p class="hint">Leave blank to keep the saved key.</p>
  </div>
  <div class="field">
    <label for="model-mode-{{ m.id if m else 'new' }}">JSON mode</label>
    <select id="model-mode-{{ m.id if m else 'new' }}" name="json_mode">
      {% for mode in ["schema", "object", "none"] %}
      <option value="{{ mode }}"{% if m and m.json_mode == mode %} selected{% endif %}>{{ mode }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="field" style="max-width: 120px">
    <label for="model-temp-{{ m.id if m else 'new' }}">Temperature</label>
    <input type="number" id="model-temp-{{ m.id if m else 'new' }}" name="temperature"
           value="{{ m.temperature if m else 0.2 }}" step="0.1" min="0" max="2">
  </div>
  <div class="field" style="max-width: 120px">
    <label for="model-tokens-{{ m.id if m else 'new' }}">Max tokens</label>
    <input type="number" id="model-tokens-{{ m.id if m else 'new' }}" name="max_tokens"
           value="{{ m.max_tokens if m else 512 }}" min="1">
  </div>
</div>
