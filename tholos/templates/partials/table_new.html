<form hx-post="/tables" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <div class="form-row">
    <div class="field" style="max-width: 240px">
      <label for="table-name">Name</label>
      <input type="text" id="table-name" name="name" value="{{ name or '' }}" required>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    </div>
    <div class="field" style="flex: 1">
      <label for="table-columns">Columns</label>
      <input type="text" id="table-columns" name="columns" value="{{ columns or '' }}"
             placeholder="title, url, status" required>
      <p class="hint">Comma separated, 1 to 12 columns.</p>
    </div>
    <button class="btn primary" type="submit">Create table</button>
  </div>
</form>
