{% if not teams %}<p class="muted">No starter teams installed.</p>{% endif %}
{% for id, name in teams %}
<div class="form-row list-row">
  <p class="flush grow"><strong>{{ name }}</strong></p>
  <form hx-post="/settings/teams" hx-target="#teams-wrap" method="post" class="inline-form">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <input type="hidden" name="name" value="{{ id }}">
    <button class="btn secondary small" type="submit">Load</button>
  </form>
</div>
{% endfor %}
<p class="small muted">Loading a team creates its agents, tables, notes, and rules. Existing items are kept.</p>
